name: Sync schedule data

on:
  workflow_dispatch:
  schedule:
    - cron: "35 */4 * * *"

permissions:
  contents: write

concurrency:
  group: sync-schedule-data
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download current Schedule Pro data
        run: git clone --depth 1 https://github.com/donovanmchenry/njitschedulepro.git "$RUNNER_TEMP/njitschedulepro"

      - name: Build room schedule
        run: python build_schedule_data.py --source "$RUNNER_TEMP/njitschedulepro/courseschedules"

      - name: Commit updated schedule
        run: |
          if git diff --quiet -- data/schedule_data.json; then
            echo "Schedule data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule_data.json
          git commit -m "Update NJIT schedule data"
          git push
